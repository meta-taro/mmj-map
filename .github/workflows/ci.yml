# 品質ゲート（product-baseline.md §5）。
#
# 手元のゲートは 2026-09-17 に入りました（`.githooks/pre-commit` → `pnpm gate`）。
# ただし **hook は clone しただけでは効きません**（`pnpm install` の `prepare` が
# `core.hooksPath` を張ります）し、`--no-verify` で外すこともできます。
# **最終ゲートはここ**です。落ちたまま放置しない・無効化して通さない（§20）。
#
# ここの並びは `pnpm gate` と同じ順にしてあります。**手元と CI で内容がずれると、
# 「手元では通ったのに CI で落ちる」が常態になり、ゲートが信用されなくなる**ためです。
# 片方だけに足さないこと。
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # **手元と同じ系列を使う。** 開発機は 24.21.0（LTS）。
      # ここが手元とずれていると、CI を最終ゲートにする意味が薄れる（§5 / §20）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # lockfile を commit したので frozen に戻した（2026-09-16）。
      # **落ちたら直すのは lockfile 側**で、ここを緩めて通さない。
      - run: pnpm install --frozen-lockfile

      # oxlint（D-015）。対象はディレクトリを並べず `.` にしてあります。
      # **並べると、新しく足したパッケージが黙って lint から漏れる**ためです
      # （実際 2026-09-17 だけで tools が 3 つ増えています）。
      - run: pnpm lint

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # カバレッジが下がったら止める（ECC `testing.md` は 80% 必須）。
      #
      # **測っていなかった。**2026-09-21 に初めて測り、除外を決めたうえで
      # statements 92.9% / branches 88.7% / functions 97.1% / lines 94.9% だった。
      # **測るだけにすると、次に下がったとき誰も気づかない**ので閾値で止める。
      #
      # 閾値を下げて通すのは禁止。下がったならテストを足すか、
      # 測らないと決めた理由を `vitest.config.ts` の exclude に書くか、どちらか。
      - name: Coverage does not fall below 80%
        run: pnpm coverage

      # 参照だけ足してアップロードを忘れる事故を、ここで止める（§23）。
      #
      # `apps/demo` は素の HTML で**ビルド工程が無い**。綴りを 1 文字間違えても
      # typecheck も test も通ったまま、**開いたときにだけ壊れる**。
      # HTML が書いている src / href / import を全部たどって、実体があるかを見る。
      # 対応表は `tools/serve` の mounts と `deploy.yml` のコピー先に揃えてある
      # （**片方だけで通る参照を作らないため**）。
      - name: Demo references existing assets
        run: pnpm asset:check

      # デモが読むスタイルが、pin したビルドの中身と噛み合っているかを確かめる（§23）。
      # JSON として読めることに加えて、**存在しない source-layer を指していないか**・
      # **一度も描かれない zoom 指定になっていないか**まで見る。
      # 参照だけ足して中身を忘れると、ビルドもテストも通ったまま実行時にだけ空になる。
      - name: Style matches the pinned basemap build
        run: pnpm style:check

      # **画面そのものを開いて見る**（ECC `ui-flow.md` 手順 3）。
      #
      # ここまでの 6 つは 1 つもブラウザを開いていません。2026-09-29 の 1 日で、
      # **415 個の単体試験が 1 つも落ちないまま、人が見て初めて分かった不具合が 7 件**
      # 出ました（上が 312px・頁が 1343px・的が 31px・地図へ飛べない…）。
      # **人が気をつける方式は必ず漏れる**ので、個人情報の検出と同じく機械に入れます。
      #
      # 見るのは「人が見なくても分かること」だけ（`tools/smoke/src/checks.ts`）。
      # 配色や余白の可否は人の領域（`DESIGN.md`）なので、ここでは判定しません。
      #
      # **タイルは要りません。**配信元が無いときデモは案内を出すのが正しい姿で、
      # ここが見るのは頁の骨格です。地図そのものは deploy 後に本番で見ます。
      - name: Demo pages are not broken (phone and desktop)
        run: |
          # ubuntu-latest には Chrome が入っている。**入れ直さない**（遅くなるだけ）
          MMJ_BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          test -n "$MMJ_BROWSER"
          export MMJ_BROWSER
          # **`--no-tiles` で配ります。**この配信は既定で「タイルはここ」という設定を
          # 差し込むので、タイルが無い CI では**地図が 404 を出し続けます**
          # （実測・2026-09-30。その 404 を console の指摘として 30 件出しました）。
          # ここが見るのは頁の骨格なので、**配信元が無いときの姿**——
          # デモが地図の代わりに案内を出す形——で配れば十分です。
          pnpm serve -- --no-tiles > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/index.html > /dev/null && break; sleep 1; done
          # **立っていないまま先へ進まない。**ブラウザのエラー画面を測ると、
          # 「的が小さい」という嘘の指摘が 30 件出て、本当の原因が埋もれます
          # （実測・2026-09-30。この一手を省いて、原因に気づくのが遅れました）。
          curl -sf http://localhost:8787/index.html > /dev/null || { cat /tmp/serve.log; exit 1; }
          pnpm smoke
