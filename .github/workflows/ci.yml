# 品質ゲート（product-baseline.md §5）。
#
# 手元のゲート（Git hooks）はまだ入っていません。開発機に Node が入っていないため
# 設定しても動きを確認できず、動かないゲートを置くと「通った」と誤読されます。
# **それまでの最終ゲートがここ**です。落ちたまま放置しない・無効化して通さない（§20）。
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # **手元と同じ系列を使う。** 開発機は 24.21.0（LTS）。
      # ここが手元とずれていると、CI を最終ゲートにする意味が薄れる（§5 / §20）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # lockfile を commit したので frozen に戻した（2026-09-16）。
      # **落ちたら直すのは lockfile 側**で、ここを緩めて通さない。
      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # 参照だけ足してアップロードを忘れる事故を、ここで止める（§23）。
      - name: Demo references an existing config
        run: test -f apps/demo/config.js

      # デモが読むスタイルが実在することを止める側で確かめる（§23）。
      # 参照だけ足してファイルを忘れると、ビルドもテストも通ったまま実行時にだけ壊れる。
      - name: Referenced style exists and is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('styles/modern-dark.json','utf8'))"
