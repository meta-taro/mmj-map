# 本番へ出す経路（baseline §43）。
#
# **push したら出る。これが既定で、例外は無い。**
# `workflow_dispatch` だけにしないこと。ボタンを押した日しか出ないので、
# 走らない workflow は CI 赤にもならず、古いまま止まっていても誰も気づけない。
#
# このリポの「本番」は **GitHub Pages 上のデモ** です。
# 鍵も外部アカウントも要りません（secrets を人に入れてもらう工程が無い＝止まらない）。
# 公開されるのは `apps/demo/` の中身だけで、タイルの配信元は `apps/demo/config.js`
# で指します。**タイルそのものはここから配信しません。**
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false     # 出している途中で止めない

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # **同梱するものが node_modules から来るので、install が要る。**
      # 以前は素の HTML を配るだけで install は不要だったが、
      # CDN をやめて MapLibre と pmtiles を同梱した時点で必要になった（2026-09-27）。
      #
      # **これを忘れて deploy を 1 回落とした。**`asset:check` は手元では通る——
      # **手元には node_modules があるから**で、検査が素通しさせた。
      # 版は `ci.yml` と同じに揃える（ずれると「CI は緑なのに本番だけ落ちる」になる）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # デモは素の HTML。ページ側のビルド工程はまだ無い。
      # ビルドが要るようになったらここに足す（このステップごと消さない）。
      - name: Check demo entrypoint
        run: test -f apps/demo/index.html

      # スタイル JSON はリポジトリ直下の styles/ が正本（D-002）。
      # Pages に出るのは apps/demo だけなので、**参照だけ残してアップロードを忘れないよう**
      # ここで同梱する（§23）。正本を 2 か所に置かないため、コピーは成果物の中だけ。
      - name: Bundle the hand-written style into the artifact
        run: |
          test -f styles/modern-dark.json
          mkdir -p apps/demo/styles
          cp styles/*.json apps/demo/styles/

      # MapLibre と pmtiles を同梱する。**CDN を見ている限り、通信が無いところで
      # 地図が 1 ピクセルも出ない**（§23）。閉じた網では CDN が遮断されていることもある。
      #
      # **版は上げない。**頁が読んでいた 5.24.0 / 4.4.0 をそのまま置く。
      # オフライン化とメジャー更新を同時にやると、**壊れたときにどちらが原因か言えない**。
      - name: Bundle MapLibre and pmtiles into the artifact
        run: |
          mkdir -p apps/demo/vendor/maplibre-gl apps/demo/vendor/pmtiles
          cp node_modules/maplibre-gl/dist/maplibre-gl.js apps/demo/vendor/maplibre-gl/
          cp node_modules/maplibre-gl/dist/maplibre-gl.css apps/demo/vendor/maplibre-gl/
          cp node_modules/pmtiles/dist/pmtiles.js apps/demo/vendor/pmtiles/
          du -sh apps/demo/vendor

      # ラベルの字。**スタイルが `../glyphs/` を指しているので、無いと字が出ない**（§23）。
      #
      # **全部は配らない。**上流のフォントは 256 範囲・5.95 MB あるが、
      # **漢字・かな・ハングルは閲覧側のフォントで描く**ので要らない。
      # ラテン系 6 範囲・561.7 KB で足りることは、日本語・ベトナム語・繁體中文・
      # ハングルの 4 地域を描いて確かめてある（2026-09-25・404 は 0 件）。
      #
      # **揃わなければ落ちる。**1 範囲欠けると、その字を含むラベルだけが消える。
      # 地図そのものは出るので、**見ても気づけない**。
      - name: Bundle the label glyphs into the artifact
        run: |
          pnpm glyphs:fetch -- --out-dir=apps/demo/glyphs
          test -f "apps/demo/glyphs/Noto Sans Regular/0-255.pbf"
          du -sh apps/demo/glyphs

      # `raster.html` が重ねる見本。**実在のハザード・雨雲・地盤ではない**——
      # OSM の公式タイルは商用と大量アクセスを認めておらず、国土地理院のものは
      # 測量成果の利用にあたるかの判断が要る（PRD §2）。だから自前で格子を作る。
      - name: Generate the sample raster overlay
        run: |
          pnpm sample-raster -- --out-dir=apps/demo/sample-raster
          test -f apps/demo/sample-raster/12/3589/1626.png
          du -sh apps/demo/sample-raster

      # 部品（Web Components）はビルドしない。素の ESM をそのまま同梱する。
      # **参照だけ足してアップロードを忘れると、elements.html だけが実行時に壊れる**（§23）。
      - name: Bundle the web components into the artifact
        run: |
          test -f packages/elements/src/index.js
          mkdir -p apps/demo/elements
          cp packages/elements/src/*.js apps/demo/elements/

      # 掴んだものの版を、配るたびに変える。
      #
      # **手で上げる方式は漏れる。**`mmj-v1` と書いて「変えたら上げること」と
      # コメントしていたが、一度も上がらなかった。その結果、一度でも開いた人には
      # **古い部品の JS が配られ続け**、頁だけ新しくなって直したものが出なかった
      # （2026-09-28・指摘で発覚）。
      #
      # **目印が無ければ止める。**名前を変えたときに黙って素通りすると、
      # 同じ壊れ方が戻ってくる。
      # 目次（sitemap）は配るときに作る。
      #
      # **手で持つと古くなる。**頁を足したときに書き足すのを忘れる方式は、
      # 掴んだものの版と同じで必ず漏れる（この直前の commit で踏んだばかり）。
      #
      # **`og.html` は入れない。**あれは OG 画像の版下で、`noindex` にしてある。
      # **`lastmod` を書かない。**嘘の更新日を出すより、書かないほうがよい。
      - name: Build the sitemap
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for f in apps/demo/*.html; do
              n=$(basename "$f")
              [ "$n" = "og.html" ] && continue
              if [ "$n" = "index.html" ]; then
                echo "  <url><loc>https://meta-taro.github.io/mmj-map/</loc></url>"
              else
                echo "  <url><loc>https://meta-taro.github.io/mmj-map/$n</loc></url>"
              fi
            done
            echo '</urlset>'
          } > apps/demo/sitemap.xml
          grep -c '<loc>' apps/demo/sitemap.xml

      - name: Stamp the service worker cache version
        run: |
          grep -q '__BUILD__' apps/demo/sw.js || {
            echo "apps/demo/sw.js に __BUILD__ がありません。掴んだものの版が固定されます" >&2
            exit 1
          }
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" apps/demo/sw.js
          grep -n 'const CACHE' apps/demo/sw.js

      # デモが読むタイルを Release から取って同梱する。
      #
      # **タイルをリポジトリに置かない。**62.8 MB を git history へ入れると、
      # 以後すべての clone がその重さを払う。Release なら成果物にだけ入る。
      #
      # **GitHub Pages は Range を返す**（実測 206 / Accept-Ranges: bytes）。
      # だめだったのは Range ではなくサイズで、1 ファイル 100 MB / サイト 1 GB が上限。
      # このファイルは 62.8 MB なので収まる（`pnpm tiles:extract -- demo` で再現できる）。
      #
      # **取れなければ deploy を落とす。**黙って案内画面のままにしない。
      - name: Bundle the demo tiles from the release
        env:
          TILES_TAG: demo-tiles-20260915
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps/demo/tiles
          gh release download "$TILES_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'demo.pmtiles' \
            --output apps/demo/tiles/demo.pmtiles
          size=$(stat -c%s apps/demo/tiles/demo.pmtiles)
          echo "demo.pmtiles: $size バイト"
          # 100 MB を越えたら Pages に載らない。**載らないものを黙って出さない**
          test "$size" -lt 104857600
          test "$size" -gt 1000000

      # 地域タイル（`regions.html` が切り替えるもの）。
      #
      # **すべて同じ上流ビルドから切り出してある**ので、`pnpm tiles:extract -- <region>`
      # で再現できる。**日本全土はここに入れられない**——2.60 GiB で、
      # 1 ファイル 100 MB にもサイト 1 GB にも収まらない。
      #
      # **1 つでも欠けたら deploy を落とす。**`regions.html` の選択肢が
      # 404 を引く状態で出さない（選べるのに出ない、が一番分かりにくい）。
      - name: Bundle the regional tiles from the release
        env:
          REGIONS_TAG: regions-20260923
          GH_TOKEN: ${{ github.token }}
        run: |
          total=0
          for region in hanoi hochiminh newyork singapore shanghai taipei seoul maihama; do
            gh release download "$REGIONS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$region.pmtiles" \
              --output "apps/demo/tiles/$region.pmtiles"
            size=$(stat -c%s "apps/demo/tiles/$region.pmtiles")
            echo "$region.pmtiles: $size バイト"
            test "$size" -lt 104857600
            test "$size" -gt 1000000
            total=$((total + size))
          done
          total=$((total + $(stat -c%s apps/demo/tiles/demo.pmtiles)))
          echo "タイル合計: $total バイト"
          # サイト全体の上限は 1 GB。タイルだけで 800 MB を越えたら設計を見直す
          test "$total" -lt 838860800

      # 成果物の中の config.js だけを、同梱したタイルへ向ける。
      # **リポジトリの apps/demo/config.js は null のまま。**手元に配信が無いのは事実なので、
      # そこを書き換えると「動くはずなのに動かない」という誤解を生む
      # （`pnpm serve` も同じやり方で、手元用の config を差し込んでいる）。
      - name: Point the bundled config at the bundled tiles
        run: |
          cat > apps/demo/config.js <<'JS'
          // **このファイルは deploy が生成したもの。**リポジトリの config.js は null のまま。
          // タイルは同じオリジンに置いてあるので、CORS も鍵も要らない。
          window.MMJ_CONFIG = {
            tilesUrl: new URL('tiles/demo.pmtiles', document.baseURI).href,
            glyphsUrl: null,
            styleUrl: new URL('styles/modern-dark.json', document.baseURI).href,
          };
          JS
          cat apps/demo/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo

      - id: deployment
        uses: actions/deploy-pages@v4

      # 出したら実物を見る。デプロイ成功 = 中身が正しい、ではない。
      #
      # **1 回で判定しない。** `deploy-pages` が返った直後は CDN がまだ温まっておらず、
      # Pages が 503 を返すことがある（実測: 2026-09-21 の acd10b6 が `-> 503` 一発で
      # 落ちた。中身は正しく出ていたのに deploy だけ赤かった）。
      # **検査を外して通すのではなく、通るまで待つ**（§20）。
      - name: Verify published page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          code=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "[$i/10] GET $url -> $code"
            if [ "$code" = "200" ]; then
              # 200 だけでは足りない。**地図の部品が乗っているところまで見る**
              if curl -s "$url" | grep -q '<mmj-map'; then
                echo "OK: <mmj-map> found"
                exit 0
              fi
              echo "::error::200 だが <mmj-map> が無い（別の中身が配信されている）"
              exit 1
            fi
            sleep 15
          done
          echo "::error::公開ページが 200 を返さなかった（最後の応答: $code）"
          exit 1

      # **配ったタイルは凍った成果物で、置き換えるまで古びていく。**
      #
      # 画面には「地図データ: 2026-09 時点」と出るようにしたが（`provenance.js`）、
      # **出しただけでは誰も見ない**。機械が数えて、越えたら知らせる。
      #
      # **落とさない。**古いこと自体は不具合ではなく、切り直すかどうかは人の判断
      # （100 GB を落として切り直す工程なので、CI が勝手に走らせるものではない）。
      # ここが出すのは事実だけ——何日前か、しきい値を越えたか。
      - name: Report how old the published tiles are
        run: |
          pnpm tiles:check-age -- "${{ steps.deployment.outputs.page_url }}tiles/demo.pmtiles" | tee /tmp/age.txt
          # 越えていたら、実行結果の要約に出す（ログの奥に埋めない）
          if grep -q "越えています" /tmp/age.txt; then
            {
              echo "### タイルが古びています"
              echo ""
              cat /tmp/age.txt
              echo ""
              echo "切り直しは \`pnpm tiles:extract -- demo\`。**人の判断です。**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
