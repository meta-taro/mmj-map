<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自前の POI を重ねる — modern-map-japan</title>
<meta name="description" content="ベース地図には触らず、自分の POI を上に重ねるデモ。名前を取る属性は利用者が決めます。">
<meta property="og:type" content="website">
<meta property="og:title" content="自前の POI を重ねる — modern-map-japan">
<meta property="og:description" content="ベース地図には触らず、自分の POI を上に重ねるデモ。名前を取る属性は利用者が決めます。">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<header class="site-header">
  <h1>自前の POI を重ねる</h1>
  <p>
    ベース地図（Protomaps / OSM）には触らず、<code>&lt;mmj-poi&gt;</code> で自分のデータを上に重ねます。
    名前は <code>name</code> ではなく <code>shop_name</code> から取っています（<code>label-key</code>）。
    <strong>この 8 点は合成データで、実在の店舗ではありません</strong>（<code>data/README.md</code>）。
  </p>
  <nav class="site-nav" aria-label="デモの一覧">
    <a href="./index.html">素の地図</a>
    <a href="./elements.html">HTML だけで置く</a>
    <a href="./3d.html">建物を立てる</a>
    <a href="./cluster.html">点をまとめる</a>
    <a href="./poi.html" aria-current="page">自前の POI</a>
    <a href="./route.html">経路と案内</a>
    <a href="./themes.html">配色を見くらべる</a>
    <a href="./brand.html">サイトの色を当てる</a>
    <a href="https://github.com/meta-taro/modern-map-japan">リポジトリ</a>
  </nav>
</header>

<main class="map-area">
  <mmj-map id="map" center="135.4761,34.6693" zoom="15" hash>
    <mmj-poi id="poi" src="./data/own-poi.geojson" label-key="shop_name" min-zoom="13"></mmj-poi>
  </mmj-map>

  <div id="picked" class="picked" hidden></div>

  <div id="notice" class="notice" hidden>
    <div class="box">
      <p>まだタイルの配信元がありません。<code>apps/demo/config.js</code> に設定します。</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.0/dist/pmtiles.js"></script>
<script src="./config.js"></script>
<script type="module">
  // **属性を入れてから部品を読み込む。**逆にすると connectedCallback が先に走る。
  const cfg = window.MMJ_CONFIG ?? {};
  const map = document.getElementById('map');

  if (!cfg.tilesUrl || !cfg.styleUrl) {
    map.remove();
    document.getElementById('notice').hidden = false;
  } else {
    map.setAttribute('tiles', cfg.tilesUrl);
    map.setAttribute('style-url', cfg.styleUrl);

    // 押したときに何を出すかは、**使う側が決める**。
    // 部品はイベントで中身を渡すところまで（PRD §3・厚くしない）。
    const picked = document.getElementById('picked');
    document.getElementById('poi').addEventListener('mmj-poi-click', (event) => {
      picked.textContent = `${event.detail.properties.shop_name}（区分 ${event.detail.properties.category}）`;
      picked.hidden = false;
    });

    await import('./elements/index.js');
  }
</script>
</body>
</html>
