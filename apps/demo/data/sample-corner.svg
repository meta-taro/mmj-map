<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" role="img" aria-label="写真の代わりの見本">
  <!-- **写真ではありません。**吹き出しに画像が載ることを見せるための見本です。
       実在の店舗や交差点の写真を置くと、いつか誰かが本物として使います。 -->
  <rect width="220" height="140" fill="#2e343b"/>
  <rect x="10" y="10" width="200" height="120" fill="none" stroke="#5a6470" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M40 100 L110 100 L110 40" fill="none" stroke="#3fb1ce" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="100" r="9" fill="#d8dce1"/>
  <text x="110" y="126" fill="#aab2bc" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">写真の見本（合成）</text>
</svg>
