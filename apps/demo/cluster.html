<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点をまとめる — modern-map-japan</title>
<meta name="description" content="点が多いときにまとめて描くデモ。まとめる計算は MapLibre の GeoJSON source に任せています。">
<meta property="og:type" content="website">
<meta property="og:title" content="点をまとめる — modern-map-japan">
<meta property="og:description" content="点が多いときにまとめて描くデモ。まとめる計算は MapLibre の GeoJSON source に任せています。">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<header class="site-header">
  <h1>点をまとめる</h1>
  <p>
    <code>&lt;mmj-cluster&gt;</code> に GeoJSON の URL を渡すだけ。200 点のサンプルを置いています。
    まとまりを押すと、そこが解ける倍率まで寄ります。
    <strong>この 200 点は合成データで、実在の場所ではありません</strong>（<code>data/README.md</code>）。
  </p>
  <nav class="site-nav" aria-label="デモの一覧">
    <a href="./index.html">素の地図</a>
    <a href="./elements.html">HTML だけで置く</a>
    <a href="./3d.html">建物を立てる</a>
    <a href="./cluster.html" aria-current="page">点をまとめる</a>
    <a href="./poi.html">自前の POI</a>
    <a href="https://github.com/meta-taro/modern-map-japan">リポジトリ</a>
  </nav>
</header>

<main class="map-area">
  <!-- z11 だと、切り出した範囲の端が画面に入って左右が黒帯になる。
       まとまりの様子は z12 でも十分見えるので、**帯が出ない倍率を既定にする**。
       範囲外の見せ方そのものは未決。決まったらここではなく部品側で持つ。 -->
  <mmj-map id="map" center="135.5023,34.6937" zoom="12" hash>
    <mmj-cluster id="cluster" src="./data/sample-points.geojson" radius="50" max-zoom="14"></mmj-cluster>
  </mmj-map>

  <div id="picked" class="picked" hidden></div>

  <div id="notice" class="notice" hidden>
    <div class="box">
      <p>まだタイルの配信元がありません。<code>apps/demo/config.js</code> に設定します。</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.0/dist/pmtiles.js"></script>
<script src="./config.js"></script>
<script type="module">
  // **属性を入れてから部品を読み込む。**逆にすると connectedCallback が先に走る。
  const cfg = window.MMJ_CONFIG ?? {};
  const map = document.getElementById('map');

  if (!cfg.tilesUrl || !cfg.styleUrl) {
    map.remove();
    document.getElementById('notice').hidden = false;
  } else {
    map.setAttribute('tiles', cfg.tilesUrl);
    map.setAttribute('style-url', cfg.styleUrl);

    // ばらの点を押したときに何を出すかは、**使う側が決める**。
    // 部品はイベントで中身を渡すところまでしかやらない（PRD §3・厚くしない）。
    const picked = document.getElementById('picked');
    document.getElementById('cluster').addEventListener('mmj-cluster-point', (event) => {
      picked.textContent = `${event.detail.properties.name}（${event.detail.properties.group}）`;
      picked.hidden = false;
    });

    await import('./elements/index.js');
  }
</script>
</body>
</html>
