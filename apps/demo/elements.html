<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML だけで地図を置く — MMJ</title>
<meta name="description" content="mmj-map と mmj-marker だけで地図を置くデモ。ビルド工程なしの素の Web Components です。">
<meta property="og:type" content="website">
<meta property="og:title" content="HTML だけで地図を置く — MMJ">
<meta property="og:description" content="mmj-map と mmj-marker だけで地図を置くデモ。ビルド工程なしの素の Web Components です。">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<header class="site-header">
  <h1>HTML だけで地図を置く</h1>
  <p>
    この画面の地図は <code>&lt;mmj-map&gt;</code> と <code>&lt;mmj-marker&gt;</code> だけで出しています。
    JavaScript は書いていません（属性を配信元へ向けている部分を除く）。
  </p>
  <nav class="site-nav" aria-label="デモの一覧">
    <a href="./index.html">はじめに</a>
    <a href="./plain.html">素の地図</a>
    <a href="./elements.html" aria-current="page">HTML だけで置く</a>
    <a href="./3d.html">建物を立てる</a>
    <a href="./cluster.html">点をまとめる</a>
    <a href="./poi.html">自前の POI</a>
    <a href="./route.html">経路と案内</a>
    <a href="./themes.html">配色を見くらべる</a>
    <a href="./brand.html">サイトの色を当てる</a>
    <a href="./regions.html">地域を切り替える</a>
    <a href="https://github.com/meta-taro/mmj-map">リポジトリ</a>
  </nav>
</header>

<!--
  **部品は素の ESM で、ビルド工程を持たない**（packages/elements/src をそのまま配る）。
  maplibre-gl と pmtiles は読み込む側が入れる。
-->
<main class="map-area">
  <mmj-map id="map" center="135.5023,34.6937" zoom="12" hash>
    <mmj-marker lnglat="135.4959,34.7024" popup="大阪梅田"></mmj-marker>
    <mmj-marker lnglat="135.5022,34.6659" popup="難波" color="#7fb2ff"></mmj-marker>
    <mmj-marker lnglat="135.5258,34.6873" popup="大阪城" color="#8fd3a6" popup-open></mmj-marker>
  </mmj-map>

  <div id="notice" class="notice" hidden>
    <div class="box">
      <p>まだタイルの配信元がありません。<code>apps/demo/config.js</code> に設定します。</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.0/dist/pmtiles.js"></script>
<script src="./config.js"></script>
<script type="module">
  // **属性を入れてから部品を読み込む。**逆にすると、属性が付く前に
  // connectedCallback が走り、「配信先が無い」と言って終わる。
  const cfg = window.MMJ_CONFIG ?? {};
  const map = document.getElementById('map');

  if (!cfg.tilesUrl || !cfg.styleUrl) {
    map.remove();
    document.getElementById('notice').hidden = false;
  } else {
    map.setAttribute('tiles', cfg.tilesUrl);
    map.setAttribute('style-url', cfg.styleUrl);
    await import('./elements/index.js');
  }
</script>
</body>
</html>
