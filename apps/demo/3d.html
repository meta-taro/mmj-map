<meta property="og:title" content="建物を立てる — MMJ">
<meta property="og:description" content="属性を 1 つ付けるだけで建物が立つデモ。タイルは 2D と同じもので、転送量は 1 バイトも増えません。">
<meta property="og:site_name" content="MMJ">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://meta-taro.github.io/mmj-map/3d.html">
<meta property="og:image" content="https://meta-taro.github.io/mmj-map/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MMJ「ここの地図を、手元に。」。大阪市街の暗色の地図に、つながらなくても出る・API キーなし・地図サーバーなし と書かれたカード。右下に © OpenStreetMap contributors。">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://meta-taro.github.io/mmj-map/og.png">
<link rel="canonical" href="https://meta-taro.github.io/mmj-map/3d.html">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<header class="site-header">
  <h1>建物を立てる</h1>
  <p>
    <code>&lt;mmj-map&gt;</code> に <code>3d</code> を付けただけです。
    <strong>タイルは 2D と同じもので、転送量は 1 バイトも増えません</strong>（実測 17 リクエスト / 735,015 B）。
    <strong>高さを持たない建物は平らなまま残ります</strong>（梅田で約 3 割）。データに無い高さを作っていません。
  </p>
  <nav class="site-nav" aria-label="デモの一覧">
    <a href="./index.html">はじめに</a>
    <a href="./plain.html">素の地図</a>
    <a href="./elements.html">HTML だけで置く</a>
    <a href="./3d.html" aria-current="page">建物を立てる</a>
    <a href="./cluster.html">点をまとめる</a>
    <a href="./poi.html">自前の POI</a>
    <a href="./shops.html">お店を見て回る</a>
    <a href="./route.html">経路と案内</a>
    <a href="./themes.html">配色を見くらべる</a>
    <a href="./brand.html">サイトの色を当てる</a>
    <a href="./regions.html">地域を切り替える</a>
    <a href="./venue.html">会場の地図</a>
    <a href="./circle.html">半径で囲む</a>
    <a href="./raster.html">重ねる</a>
    <a href="./flood.html">面で塗り分ける</a>
    <a href="https://github.com/meta-taro/mmj-map">リポジトリ</a>
  </nav>
</header>

<main class="map-area">
  <mmj-map id="map" center="135.4959,34.7024" zoom="16" pitch="60" hash 3d></mmj-map>

  <div id="notice" class="notice" hidden>
    <div class="box">
      <p>まだタイルの配信元がありません。<code>apps/demo/config.js</code> に設定します。</p>
    </div>
  </div>
</main>

<script src="./vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="./vendor/pmtiles/pmtiles.js"></script>
<script src="./config.js"></script>
<script type="module">
  // **属性を入れてから部品を読み込む。**逆にすると connectedCallback が先に走る。
  const cfg = window.MMJ_CONFIG ?? {};
  const map = document.getElementById('map');

  if (!cfg.tilesUrl || !cfg.styleUrl) {
    map.remove();
    document.getElementById('notice').hidden = false;
  } else {
    map.setAttribute('tiles', cfg.tilesUrl);
    map.setAttribute('style-url', cfg.styleUrl);
    await import('./elements/index.js');
  }
</script>
</body>
</html>
