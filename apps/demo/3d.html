<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建物を立てる — modern-map-japan</title>
<meta name="description" content="属性を 1 つ付けるだけで建物が立つデモ。タイルは 2D と同じもので、転送量は 1 バイトも増えません。">
<meta property="og:type" content="website">
<meta property="og:title" content="建物を立てる — modern-map-japan">
<meta property="og:description" content="属性を 1 つ付けるだけで建物が立つデモ。タイルは 2D と同じもので、転送量は 1 バイトも増えません。">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>

<header class="site-header">
  <h1>建物を立てる</h1>
  <p>
    <code>&lt;mmj-map&gt;</code> に <code>3d</code> を付けただけです。
    <strong>タイルは 2D と同じもので、転送量は 1 バイトも増えません</strong>（実測 17 リクエスト / 735,015 B）。
    <strong>高さを持たない建物は平らなまま残ります</strong>（梅田で約 3 割）。データに無い高さを作っていません。
  </p>
  <nav class="site-nav" aria-label="デモの一覧">
    <a href="./index.html">素の地図</a>
    <a href="./elements.html">HTML だけで置く</a>
    <a href="./3d.html" aria-current="page">建物を立てる</a>
    <a href="./cluster.html">点をまとめる</a>
    <a href="./poi.html">自前の POI</a>
    <a href="./themes.html">配色を見くらべる</a>
    <a href="./brand.html">サイトの色を当てる</a>
    <a href="https://github.com/meta-taro/modern-map-japan">リポジトリ</a>
  </nav>
</header>

<main class="map-area">
  <mmj-map id="map" center="135.4959,34.7024" zoom="16" pitch="60" hash 3d></mmj-map>

  <div id="notice" class="notice" hidden>
    <div class="box">
      <p>まだタイルの配信元がありません。<code>apps/demo/config.js</code> に設定します。</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.0/dist/pmtiles.js"></script>
<script src="./config.js"></script>
<script type="module">
  // **属性を入れてから部品を読み込む。**逆にすると connectedCallback が先に走る。
  const cfg = window.MMJ_CONFIG ?? {};
  const map = document.getElementById('map');

  if (!cfg.tilesUrl || !cfg.styleUrl) {
    map.remove();
    document.getElementById('notice').hidden = false;
  } else {
    map.setAttribute('tiles', cfg.tilesUrl);
    map.setAttribute('style-url', cfg.styleUrl);
    await import('./elements/index.js');
  }
</script>
</body>
</html>
