<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頁に置いた見本 — MMJ</title>
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<div class="preview-bar">
  <h1>頁に置いた見本</h1>
  <div class="actions" role="group" aria-label="頁の幅">
    <button type="button" data-width="390" aria-pressed="false">携帯 390</button>
    <button type="button" data-width="1100" aria-pressed="true">PC 1100</button>
  </div>
  <div class="actions">
    <button type="button" id="copy-html">HTML を写す</button>
    <button type="button" id="copy-brief">AI に渡す形で写す</button>
  </div>
  <p class="note" id="tiles-note"></p>
  <form class="pin-form" id="pin-form" autocomplete="off">
    <label>名前 <input id="pin-name" maxlength="60" placeholder="例: 株式会社〇〇"></label>
    <label>住所・一言 <input id="pin-note" maxlength="120" placeholder="例: 大阪市北区〇〇 1-2-3"></label>
    <div class="actions">
      <button type="button" id="pin-center">地図の真ん中へ移す</button>
      <button type="button" id="pin-toggle">ピンを外す</button>
    </div>
    <p class="note">地図を押すと、ピンがそこへ動きます。入れた名前・住所・位置は、写すものにそのまま入ります。</p>
  </form>
</div>

<main class="preview-stage">
  <div class="mock-page" id="mock-page">
    <header>（あなたの頁）</header>
    <section>
      <h2>アクセス</h2>
      <p>ここに案内の文が入ります。地図は下の 1 枚です。</p>
      <div id="map-slot"></div>
    </section>
  </div>
</main>

<script src="vendor/pmtiles/pmtiles.js"></script>
<script type="module" src="preview.js"></script>
</body>
</html>
